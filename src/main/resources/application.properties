spring.application.name=sistema-aluguel-carros

spring.datasource.url=jdbc:postgresql://localhost:5432/aluguel_carros
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# Administrador inicial
app.admin.nome=${ADMIN_NAME:Administrador}
app.admin.email=${ADMIN_EMAIL}
app.admin.senha=${ADMIN_PASSWORD}

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Informações da aplicação no Actuator
info.app.name=${spring.application.name}
info.app.description=API para gerenciamento de aluguel de carros
info.app.version=@project.version@
